<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفعة 24</title>
<meta name="description" content="الموقع الرسمي لدفعة 24 — أمانات الدفعة وأخبارها">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--navy:#0E1E45;--navy2:#16316B;--or:#F58A1F;--or2:#FFB25E;--mut:#D3DCEF}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--navy);color:#F6F8FC;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.s{fill:var(--sf,rgba(255,255,255,.15));stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* الشريط العلوي */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;min-height:84px;padding:8px 16px;background:linear-gradient(180deg,#FFFFFF 0%,#E3EAF8 100%);border-radius:0 0 36px 36px;border-bottom:6px solid var(--or);box-shadow:0 14px 30px -12px rgba(0,0,0,.55)}
.topbar img{height:68px;width:auto;display:block}
.topbar .back{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--navy);border-color:var(--or);background:rgba(14,30,69,.06);backdrop-filter:none;padding:7px 14px;font-size:14px}
.topbar .back:hover{background:rgba(245,138,31,.22)}

/* الرئيسية */
.home{position:relative;overflow:hidden;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#27468A 0%,#16305F 48%,#0E1E45 100%);display:flex;flex-direction:column;align-items:center;padding:0 24px 80px;gap:34px}
.home .lines{position:absolute;inset:0;pointer-events:none}
.home .ln{position:absolute;top:-20%;height:140%;width:2px;opacity:0;animation:slide 9s linear infinite}
.home .topbar{align-self:stretch;margin:0 -24px}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:100%;padding-top:20px}
.hero .tag{margin:0;font-size:clamp(18px,3.4vw,24px);font-weight:600;color:#E4EAF6;max-width:560px;line-height:1.8;opacity:0;animation:rise .9s ease 1.4s forwards}
.sec{position:relative;width:100%;max-width:1040px;display:flex;flex-direction:column;gap:18px}
.sec h2{margin:0;font-size:22px;font-weight:600;color:var(--or2)}
.cards{display:flex;flex-wrap:wrap;gap:14px}
.card{flex:1 1 280px;padding:20px 24px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:0;animation:rise .8s ease forwards;transition:border-color .2s,background .2s,transform .2s}
.card:hover{border-color:var(--or);background:rgba(245,138,31,.14);transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.card b{display:block;font-size:20px;font-weight:600}
.card small{font-size:14px;color:var(--mut)}
.status{position:relative;color:var(--mut);font-size:15px;text-align:center;padding:30px 0}

/* صفحة الأمانة / النادي */
.pg{position:relative;min-height:100vh;color:#fff;padding:0 20px 90px}
.pg .topbar{margin:0 -20px}
.pgbg{position:fixed;inset:-12px;z-index:0;background:linear-gradient(160deg,#1E4396 0%,#14295A 55%,#0E1E45 100%);background-size:cover;background-position:center}
.pgbg.img{filter:blur(3px)}
.pgov{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 0%,rgba(245,138,31,.22),transparent 45%),linear-gradient(180deg,rgba(14,30,69,.38) 0%,rgba(14,30,69,.78) 100%)}
.pg>*:not(.pgbg):not(.pgov):not(.topbar){position:relative;z-index:1}
.pg>.topbar{z-index:5}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;border:1px solid rgba(255,178,94,.7);color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:15px;transition:background .2s}
.back:hover{background:rgba(245,138,31,.28)}
.back:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.top{max-width:1180px;margin:0 auto;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;position:relative}
.top .shapes{position:absolute;inset:0;pointer-events:none;color:var(--or2);--sf:rgba(255,255,255,.14)}
.name{margin:6px 0 0;font-family:'Aref Ruqaa','Cairo',serif;font-weight:700;font-size:clamp(46px,9vw,92px);line-height:1.25;text-shadow:0 4px 24px rgba(0,0,0,.45);opacity:0;animation:rise .9s ease .9s forwards}
.rule{display:flex;align-items:center;gap:10px;width:280px;max-width:80%;opacity:0;animation:rule .8s ease 1.3s forwards}
.rule i{flex:1;height:3px;border-radius:2px}
.rule i:first-child{background:linear-gradient(to left,var(--or),transparent)}
.rule i:last-child{background:linear-gradient(to right,var(--or),transparent)}
.rule u{width:11px;height:11px;transform:rotate(45deg);background:var(--or)}
.sub{margin:4px 0 0;font-size:clamp(17px,3vw,22px);font-weight:600;color:#EAF0FB;text-shadow:0 2px 12px rgba(0,0,0,.5);opacity:0;animation:rise .9s ease 1.5s forwards}
.shape{position:absolute;height:auto;opacity:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));animation:pop .8s cubic-bezier(.2,1.4,.4,1) var(--t) forwards,float 6s ease-in-out calc(var(--t) + .9s) infinite alternate}

/* النوافذ الزجاجية */
.wins{max-width:1100px;margin:8px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start;gap:22px}
.win{position:relative;overflow:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:220px;background:rgba(14,30,69,.42);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.24);
  box-shadow:0 28px 50px -22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3);opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--t,1.8s) forwards}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.03) 38%,transparent 55%);pointer-events:none}
.win::after{content:"";position:absolute;right:-80px;top:-100px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(245,138,31,.34) 0%,transparent 68%);pointer-events:none}
.win>*{position:relative;z-index:1}
.win.wide{grid-column:1/-1}
.wico{width:58px;height:58px;border-radius:19px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:var(--or2);--sf:rgba(255,255,255,.14)}
.win h3{margin:4px 0 0;font-size:23px;font-weight:800}
.win .d{margin:0;font-size:15px;line-height:1.8;color:var(--mut)}
.chip{align-self:flex-start;padding:4px 14px;border-radius:999px;background:rgba(245,138,31,.2);border:1px solid rgba(255,178,94,.55);font-size:13px;font-weight:600;color:#FFD9AE}
.mem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mem li,.nw{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:5px}
.mem b{font-weight:600;font-size:16px}.mem span{font-size:13px;color:var(--mut)}
.nw h4{margin:0;font-size:16px;font-weight:600}
.nw p{margin:0;font-size:14px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere}
.nw time{font-size:12px;color:var(--mut)}
.ni{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.tag2{align-self:flex-start;padding:2px 12px;border-radius:999px;background:var(--or);color:var(--navy);font-size:12px;font-weight:800}
.lst{display:flex;flex-direction:column;gap:8px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);font-weight:600;font-size:15px;transition:background .2s,border-color .2s}
.lk:hover{background:rgba(245,138,31,.25);border-color:var(--or2)}
.lk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lk small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.tx{margin:0;font-size:15px;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}

/* عداد */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.cd div{border-radius:14px;padding:8px 2px;text-align:center;background:rgba(14,30,69,.55);border:1px solid rgba(255,178,94,.5)}
.cd b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:var(--or2);font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--mut)}
.cd.done{display:block;text-align:center;font-weight:800;color:var(--or2);padding:6px}

/* استبيان ونماذج */
.sv{border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.svh{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.svh:focus-visible{outline:3px solid var(--or);outline-offset:-3px}
.svh b{font-size:16px;font-weight:600}.svh span{font-size:13px;color:var(--mut)}
.f{padding:0 16px 16px}
fieldset{border:0;margin:12px 0 0;padding:0}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:2px}
.op{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.1);margin-top:6px;cursor:pointer}
.op input{accent-color:var(--or);width:18px;height:18px;margin:0}
.f label.l{display:block;font-size:13px;margin:12px 0 4px;color:var(--mut)}
.f input[type=text],.f input[type=tel],.f input[type=email],.f textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);color:#fff;font:inherit}
.f input::placeholder,.f textarea::placeholder{color:#AEBBD6}
.f input:focus,.f textarea:focus{outline:3px solid rgba(245,138,31,.55);border-color:var(--or2)}
.go{margin-top:14px;border:0;border-radius:12px;padding:10px 26px;font:inherit;font-weight:800;cursor:pointer;color:var(--navy);background:linear-gradient(135deg,#FFB25E,#F58A1F)}
.go:disabled{opacity:.55}
.msg{margin:10px 0 0;font-size:14px;color:#FFD9AE;min-height:1.2em}
.ok{padding:16px;text-align:center;font-weight:600;color:#FFD9AE}

@keyframes pop2{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(245,138,31,.2))}50%{filter:drop-shadow(0 0 26px rgba(245,138,31,.6))}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes rule{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes slide{0%{transform:translateX(-120%) rotate(-47deg);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateX(120%) rotate(-47deg);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.3) rotate(var(--r))}100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}
@keyframes float{0%{transform:translateY(0) rotate(var(--r))}100%{transform:translateY(-16px) rotate(calc(var(--r) + 6deg))}}
@media (max-width:700px){.shape{width:56px!important}.top{min-height:250px}.pg{padding:0 14px 80px}.pg .topbar{margin:0 -14px}.topbar img{height:58px}}
@media (prefers-reduced-motion:reduce){
  .card,.hero .tag,.name,.rule,.sub,.win,.shape{animation:none!important;opacity:1}
  .shape{transform:rotate(var(--r))}.ln{display:none}
}
</style>
</head>

<script>
(function () {
  'use strict';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var safeUrl = function (u) { return /^(https?:\/\/|mailto:|tel:)/i.test(u || '') ? u : '#'; };
  var $app = document.getElementById('app');
  var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';

  /* أشكال عائمة (للأمانات التي بلا صورة خلفية) */
  var POS = [[3, 4, 112, -10, 1.8], [15, 40, 84, 8, 2], [5, 62, 100, -6, 2.2], [85, 6, 104, 10, 2.4], [75, 42, 88, -8, 2.6], [88, 64, 96, 6, 2.8]];
  var SHAPES = {
    academic: ['cap', 'pencil', 'book', 'bulb', 'book', 'pencil'], finance: ['coin', 'bars', 'wallet', 'bars', 'coin', 'coin'],
    sports: ['soccer', 'tennis', 'basket', 'basket', 'soccer', 'tennis'], cultural: ['book', 'quill', 'bubble', 'bulb', 'star', 'quill'],
    social: ['heart', 'people', 'bubble', 'people', 'heart', 'heart'], media: ['camera', 'play', 'mic', 'mic', 'camera', 'play'],
    general: ['shield', 'star', 'gear', 'gear', 'shield', 'star'], president: ['crown', 'star', 'star', 'star', 'crown', 'star']
  };

  var DEFAULT_AMANAT = [
    ['academic', 'الأمانة الأكاديمية', 'المحاضرات والمواد والامتحانات'], ['finance', 'الأمانة المالية', 'موارد الدفعة ومصروفاتها'],
    ['sports', 'الأمانة الرياضية', 'البطولات والأنشطة الرياضية'], ['cultural', 'الأمانة الثقافية', 'الندوات والمسابقات والمواهب'],
    ['social', 'الأمانة الاجتماعية', 'الرحلات والمناسبات والتكافل'], ['media', 'الأمانة الإعلامية', 'التوثيق والتصميم والنشر'],
    ['general', 'الأمانة العامة', 'تنسيق عمل الأمانات وتمثيل الدفعة'], ['president', 'رئيس الدفعة', 'قيادة الدفعة وتمثيلها']
  ].map(function (a, i) { return { id: a[0], name: a[1], tagline: a[2], kind: a[0], sort: i + 1, visible: true }; });

  var CFG = window.B24_CONFIG || {}, KEY = CFG.SUPABASE_ANON_KEY || '', BASE = (CFG.SUPABASE_URL || '').replace(/\/+$/, '') + '/rest/v1/';
  var LIVE = !!(BASE.length > 10 && KEY);
  var DB = { amanat: null, blocks: [], surveys: [], clubs: [], error: false };

  function hdr(extra) {
    var h = { apikey: KEY };
    if (KEY.indexOf('sb_') !== 0) h.Authorization = 'Bearer ' + KEY;
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function rest(path) { return fetch(BASE + path, { headers: hdr() }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function post(t, body) {
    return fetch(BASE + t, { method: 'POST', headers: hdr({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }), body: JSON.stringify(body) })
      .then(function (r) { if (r.status === 409) throw new Error('dup'); if (!r.ok) throw new Error(r.status); });
  }
  function load() {
    if (!LIVE) { DB.amanat = DEFAULT_AMANAT; return Promise.resolve(); }
    var soft = function (p) { return p.catch(function () { return []; }); };
    return Promise.all([
      rest('amanat?select=*&visible=eq.true&order=sort.asc'),
      rest('blocks?select=*&visible=eq.true&order=sort.asc'),
      soft(rest('surveys?select=*&order=created_at.desc')),
      soft(rest('clubs?select=*&order=created_at.asc'))
    ]).then(function (r) { DB.amanat = r[0]; DB.blocks = r[1]; DB.surveys = r[2]; DB.clubs = r[3]; })
      .catch(function () { DB.error = true; });
  }

  /* هوية الجهاز (رد واحد لكل جهاز) */
  function uid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2); }
  function dev() { try { var d = localStorage.getItem('b24_dev'); if (!d) { d = uid(); localStorage.setItem('b24_dev', d); } return d; } catch (e) { return uid(); } }
  function done(id) { try { return !!localStorage.getItem('b24_done_' + id); } catch (e) { return false; } }
  function markDone(id) { try { localStorage.setItem('b24_done_' + id, '1'); } catch (e) {} }
  function fmt(d) { try { return new Date(d).toLocaleString('ar-u-nu-latn', { dateStyle: 'full', timeStyle: 'short' }); } catch (e) { return d; } }

  /* ================= الرئيسية ================= */
  var LOGO = window.B24_LOGO || '';
  function bar(back) { return '<header class="topbar">' + (back || '') + '<img src="' + esc(LOGO) + '" alt="شعار دفعة 24"></header>'; }

  function renderHome() {
    document.title = 'دفعة 24';
    document.body.style.background = '#0E1E45';
    var cards = DB.amanat.map(function (a, i) {
      return '<a class="card" style="animation-delay:' + (1.6 + i * 0.1) + 's" href="#/a/' + encodeURIComponent(a.id) + '"><div><b>' + esc(a.name) +
        '</b><small>عرض الصفحة</small></div><span style="color:#FFB25E">' + ARROW + '</span></a>';
    }).join('');
    var body = DB.error ? '<p class="status">تعذّر تحميل البيانات. تأكد من الاتصال وحاول مرة أخرى.</p>' : '<div class="cards">' + cards + '</div>';
    var ln = function (l, d, c) { return '<div class="ln" style="left:' + l + '%;animation-delay:' + d + 's;background:linear-gradient(to bottom,transparent,' + c + ',transparent)"></div>'; };
    $app.innerHTML = '<main class="home">' + bar() + '<div class="lines" aria-hidden="true">' + ln(12, 0, '#F58A1F') + ln(38, 3, '#8AA4D6') + ln(62, 6, '#F58A1F') + ln(86, 1.5, '#8AA4D6') + '</div>' +
      '<div class="hero"><h1 class="name">دفعة 24</h1><div class="rule" aria-hidden="true"><i></i><u></u><i></i></div><p class="tag">روحٌ تتشابك للتطوّر، وأثرٌ يخلّد الإرث</p></div>' +
      '<section class="sec"><h2>أمانات الدفعة</h2>' + body + '</section></main>';
  }

  /* ================= مكوّنات النوافذ ================= */
  function iconSym(n) { return '<svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><use href="#i-' + esc(n) + '"/></svg>'; }
  function win(ico, title, desc, inner, i, wide) {
    return '<section class="win' + (wide ? ' wide' : '') + '" style="--t:' + (1.7 + i * 0.18) + 's"><div class="wico">' + iconSym(ico) + '</div><h3>' + esc(title) + '</h3>' +
      (desc ? '<p class="d">' + esc(desc) + '</p>' : '') + (inner || '<span class="chip">قريباً</span>') + '</section>';
  }
  function newsItem(n) {
    return '<article class="nw">' + (n.image ? '<img class="ni" loading="lazy" alt="" src="' + esc(safeUrl(n.image)) + '">' : '') +
      (n.kind === 'ad' ? '<span class="tag2">إعلان</span>' : '') + (n.title ? '<h4>' + esc(n.title) + '</h4>' : '') +
      (n.body ? '<p>' + esc(n.body) + '</p>' : '') + (n.date ? '<time>' + esc(n.date) + '</time>' : '') + '</article>';
  }
  function newsList(items) {
    items = (items || []).filter(function (n) { return n && (n.title || n.body || n.image); });
    return items.length ? '<div class="lst">' + items.map(newsItem).join('') + '</div>' : '';
  }
  function blockBody(b) {
    var c = b.content || {}, items = Array.isArray(c.items) ? c.items : [];
    if (b.type === 'members') {
      items = items.filter(function (m) { return m && m.name; });
      return items.length ? '<ul class="mem">' + items.map(function (m) { return '<li><b>' + esc(m.name) + '</b>' + (m.role ? '<span>' + esc(m.role) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '';
    }
    if (b.type === 'news') return newsList(items);
    if (b.type === 'event') {
      items = items.filter(function (e) { return e && e.title; });
      return items.length ? '<div class="lst">' + items.map(function (e) {
        return '<article class="nw"><h4>' + esc(e.title) + '</h4>' + (e.body ? '<p>' + esc(e.body) + '</p>' : '') +
          (e.date ? (e.countdown ? '<div class="cd" data-t="' + esc(e.date) + '"></div>' : '<time>' + esc(fmt(e.date)) + '</time>') : '') + '</article>';
      }).join('') + '</div>' : '';
    }
    if (b.type === 'links') {
      items = items.filter(function (l) { return l && l.label && l.url; });
      return items.length ? '<div class="lst">' + items.map(function (l) {
        return '<a class="lk" href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer"><span>' + esc(l.label) + '</span>' + ARROW + '</a>';
      }).join('') + '</div>' : '';
    }
    if (b.type === 'text') return c.text ? '<p class="tx">' + esc(c.text) + '</p>' : '';
    return '';
  }

  /* ---- استبيانات ---- */
  function avail(s) { return s.open && (!s.ends_at || new Date(s.ends_at) > new Date()); }
  function surveyHTML(s) {
    if (done(s.id)) return '<div class="sv"><div class="ok">شكراً، سبق أن شاركت في «' + esc(s.title) + '»</div></div>';
    var qs = (s.questions || []).map(function (q, j) {
      var h = '<fieldset><legend>' + esc(q.text) + '</legend>';
      if (q.type === 'text') h += '<textarea name="q' + j + '" rows="3" maxlength="1000" placeholder="اكتب إجابتك"></textarea>';
      else (q.options || []).forEach(function (o) {
        h += '<label class="op"><input type="' + (q.type === 'multi' ? 'checkbox' : 'radio') + '" name="q' + j + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>';
      });
      return h + '</fieldset>';
    }).join('');
    return '<div class="sv"><button class="svh" type="button" data-tg="1" aria-expanded="false"><b>' + esc(s.title) + '</b>' + (s.topic ? '<span>' + esc(s.topic) + '</span>' : '') + '</button>' +
      '<form class="f svf" data-id="' + esc(s.id) + '" hidden>' + qs + '<button class="go" type="submit">إرسال</button><p class="msg" role="status"></p></form></div>';
  }
  function sendSurvey(f) {
    var s = DB.surveys.filter(function (x) { return x.id === f.dataset.id; })[0], ans = {}, ok = true, msg = f.querySelector('.msg'), btn = f.querySelector('.go');
    s.questions.forEach(function (q, j) {
      var els = [].slice.call(f.querySelectorAll('[name="q' + j + '"]'));
      if (q.type === 'text') { var t = els[0].value.trim(); if (t) ans[q.id] = t; return; }
      var v = els.filter(function (e) { return e.checked; }).map(function (e) { return e.value; });
      if (!v.length) ok = false; else ans[q.id] = q.type === 'multi' ? v : v[0];
    });
    if (!ok) { msg.textContent = 'أجب عن كل الأسئلة المطلوبة قبل الإرسال.'; return; }
    btn.disabled = true; msg.textContent = '';
    var fin = function (t) { markDone(s.id); f.parentNode.innerHTML = '<div class="ok">' + t + '</div>'; };
    post('survey_responses', { survey_id: s.id, device: dev(), answers: ans })
      .then(function () { fin('شكراً لمشاركتك! تم استلام ردك.'); })
      .catch(function (e) { if (e.message === 'dup') fin('سبق أن شاركت من هذا الجهاز، شكراً لك.'); else { btn.disabled = false; msg.textContent = 'تعذّر الإرسال، حاول مرة أخرى.'; } });
  }
  function surveysWin(i) {
    var list = DB.surveys.filter(avail);
    return win('bubble', 'الاستبيانات واستطلاعات الرأي', 'رأيك يهمنا — يمكنك المشاركة مرة واحدة من كل جهاز', list.length ? '<div class="lst">' + list.map(surveyHTML).join('') + '</div>' : '', i, true);
  }

  /* ---- نوادي ---- */
  function clubsWin(i) {
    var h = DB.clubs.length ? '<div class="lst">' + DB.clubs.map(function (c) {
      return '<a class="lk" href="#/c/' + encodeURIComponent(c.id) + '"><span>' + esc(c.name) + '<small>' + (c.open ? 'التسجيل مفتوح' : 'التسجيل مغلق') + '</small></span>' + ARROW + '</a>';
    }).join('') + '</div>' : '';
    return win('star', 'النوادي', 'انضم إلى نادٍ يناسب اهتمامك', h, i, true);
  }
  function sendReg(f) {
    var c = DB.clubs.filter(function (x) { return x.id === f.dataset.id; })[0], msg = f.querySelector('.msg'), btn = f.querySelector('.go');
    btn.disabled = true; msg.textContent = '';
    post('club_members', { club_id: c.id, name: f.elements.name.value.trim(), phone: f.elements.phone.value.trim(), email: f.elements.email.value.trim().toLowerCase() })
      .then(function () { f.parentNode.innerHTML = '<div class="ok">تم تسجيلك في «' + esc(c.name) + '». سنتواصل معك قريباً.</div>'; })
      .catch(function (e) { btn.disabled = false; msg.textContent = e.message === 'dup' ? 'هذا البريد مسجّل في النادي مسبقاً.' : 'تعذّر التسجيل، حاول مرة أخرى.'; });
  }

  /* ================= هيكل الصفحة ================= */
  function shell(o) {
    document.title = o.name + ' — دفعة 24';
    document.body.style.background = '#0E1E45';
    var img = (window.B24_BG || {})[o.kind] || '', shapes = '';
    if (!img) {
      var kind = SHAPES[o.kind] ? o.kind : 'general';
      shapes = '<div class="shapes" aria-hidden="true">' + SHAPES[kind].map(function (s, i) {
        var p = POS[i];
        return '<svg class="shape" viewBox="0 0 64 64" style="left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + 'px;--t:' + p[4] + 's;--r:' + p[3] + 'deg"><use href="#i-' + s + '"/></svg>';
      }).join('') + '</div>';
    }
    return '<main class="pg"><div class="pgbg' + (img ? ' img' : '') + '"' + (img ? ' style="background-image:url(' + esc(img) + ')"' : '') + '></div><div class="pgov"></div>' +
      '' + bar('<a class="back" href="' + esc(o.back) + '"><span>' + esc(o.backText) + '</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>') +
      '<div class="top">' + shapes + '<h1 class="name">' + esc(o.name) + '</h1><div class="rule" aria-hidden="true"><i></i><u></u><i></i></div>' +
      (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '') + '</div><div class="wins">' + o.wins + '</div></main>';
  }

  function renderAmana(id) {
    var a = DB.amanat.filter(function (x) { return x.id === id; })[0];
    if (!a) { $app.innerHTML = '<main class="home"><p class="status">الصفحة غير موجودة.</p><a class="card" style="animation-delay:.2s" href="#/"><b>الرئيسية</b></a></main>'; return; }
    var blocks = DB.blocks.filter(function (b) { return b.amana_id === id; }), n = 0;
    var wins = blocks.map(function (b) { return win(b.icon, b.title, b.description, blockBody(b), n++); }).join('');
    if (a.kind === 'social') wins += surveysWin(n++);
    if (a.kind === 'cultural') wins += clubsWin(n++);
    $app.innerHTML = shell({ kind: a.kind, back: '#/', backText: 'الرئيسية', name: a.name, sub: a.tagline, wins: wins });
  }

  function renderClub(id) {
    var c = DB.clubs.filter(function (x) { return x.id === id; })[0], am = DB.amanat.filter(function (x) { return x.kind === 'cultural'; })[0];
    if (!c || !am) { $app.innerHTML = '<main class="home"><p class="status">النادي غير موجود.</p><a class="card" style="animation-delay:.2s" href="#/"><b>الرئيسية</b></a></main>'; return; }
    var about = (c.image_url ? '<img class="ni" alt="" src="' + esc(safeUrl(c.image_url)) + '">' : '') + (c.description ? '<p class="tx">' + esc(c.description) + '</p>' : '');
    var form = !c.open ? '<span class="chip">التسجيل مغلق حالياً</span>' :
      '<form class="f reg" data-id="' + esc(c.id) + '" style="padding:0"><label class="l" for="rn">الاسم الكامل</label><input id="rn" name="name" type="text" required maxlength="80" autocomplete="name">' +
      '<label class="l" for="rp">رقم التواصل</label><input id="rp" name="phone" type="tel" required maxlength="20" dir="ltr" autocomplete="tel">' +
      '<label class="l" for="re">البريد الإلكتروني</label><input id="re" name="email" type="email" required maxlength="120" dir="ltr" autocomplete="email">' +
      '<button class="go" type="submit">سجّل في النادي</button><p class="msg" role="status"></p></form>';
    var wins = win('star', 'عن النادي', '', about, 0) + win('bubble', 'أخبار النادي', '', newsList(c.news), 1) + win('people', 'التسجيل في النادي', c.open ? 'املأ بياناتك وسنتواصل معك' : '', form, 2);
    $app.innerHTML = shell({ kind: 'cultural', back: '#/a/' + encodeURIComponent(am.id), backText: am.name, name: c.name, sub: 'نادٍ من ' + am.name, wins: wins });
  }

  /* ================= أحداث ================= */
  $app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tg]'); if (!b) return;
    var f = b.nextElementSibling, open = f.hidden; f.hidden = !open; b.setAttribute('aria-expanded', open);
  });
  $app.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.classList.contains('svf')) { e.preventDefault(); sendSurvey(f); }
    else if (f.classList.contains('reg')) { e.preventDefault(); sendReg(f); }
  });
  setInterval(function () {
    [].forEach.call(document.querySelectorAll('.cd'), function (el) {
      var d = new Date(el.dataset.t) - Date.now();
      if (isNaN(d)) return;
      if (d <= 0) { el.className = 'cd done'; el.textContent = 'حان موعد الفعالية'; return; }
      var s = Math.floor(d / 1000), v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60], l = ['يوم', 'ساعة', 'دقيقة', 'ثانية'];
      el.innerHTML = v.map(function (x, i) { return '<div><b>' + x + '</b><span>' + l[i] + '</span></div>'; }).join('');
    });
  }, 1000);

  var cur = location.hash;
  function route() {
    window.scrollTo(0, 0);
    if (!DB.amanat) return;
    try {
      var a = cur.match(/^#\/a\/([^/?]+)/), c = cur.match(/^#\/c\/([^/?]+)/);
      if (a) renderAmana(decodeURIComponent(a[1])); else if (c) renderClub(decodeURIComponent(c[1])); else renderHome();
    } catch (err) {
      $app.innerHTML = '<main class="home"><p class="status">حدث خطأ في عرض الصفحة: ' + esc(err && err.message) + '</p><a class="card" style="animation-delay:.2s" href="#/"><b>الرئيسية</b></a></main>';
    }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#/"]'); if (!a) return;
    e.preventDefault(); cur = a.getAttribute('href');
    try { location.hash = cur; } catch (x) {}
    route();
  });
  window.addEventListener('hashchange', function () { if (location.hash !== cur) { cur = location.hash; route(); } });
  $app.innerHTML = '<main class="home"><p class="status">جارٍ التحميل…</p></main>';
  load().then(route);
})();
</script>
</body>
</html>
