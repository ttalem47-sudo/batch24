<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:#0F1B2D;color:#F4F1EA;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.s{fill:var(--sf,rgba(255,255,255,.15));stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- الصفحة الرئيسية ---------- */
.home{position:relative;overflow:hidden;min-height:100vh;background:radial-gradient(ellipse at 50% 14%,#27406E 0%,#16263F 48%,#0F1B2D 100%);display:flex;flex-direction:column;align-items:center;padding:64px 24px 80px;gap:52px}
.home .lines{position:absolute;inset:0;pointer-events:none}
.home .ln{position:absolute;top:-20%;height:140%;width:2px;opacity:0;animation:slide 9s linear infinite}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;width:100%}
.hero .tag{margin:0;font-size:clamp(18px,3.4vw,24px);font-weight:600;color:#DDE4F0;max-width:560px;line-height:1.8;opacity:0;animation:rise .9s ease 3s forwards}
.sec{position:relative;width:100%;max-width:1040px;display:flex;flex-direction:column;gap:20px}
.sec h2{margin:0;font-size:22px;font-weight:600;color:#E9B949}
.cards{display:flex;flex-wrap:wrap;gap:16px}
.card{flex:1 1 280px;padding:22px 24px;border:1.5px solid #2E4468;border-radius:16px;background:#1B2B45;display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:0;animation:rise .8s ease forwards;transition:border-color .2s,background .2s,transform .2s}
.card:hover{border-color:#E9B949;background:#22365A;transform:translateY(-3px)}
.card:focus-visible{outline:3px solid #E9B949;outline-offset:3px}
.card b{display:block;font-size:20px;font-weight:600}
.card small{font-size:14px;color:#B8C0CC}
.status{position:relative;color:#B8C0CC;font-size:15px;text-align:center;padding:30px 0}

/* ---------- لوقو ---------- */
.logo path{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;stroke-opacity:1;stroke-width:1.1;fill-rule:evenodd;animation:draw 2.2s ease-in-out var(--d,0s) forwards,fillin .8s ease calc(var(--d,0s) + 1.9s) forwards}
.home .logo{animation:glow 5s ease-in-out 3.4s infinite}

/* ---------- صفحة الأمانة ---------- */
.pg{position:relative;overflow:hidden;min-height:100vh;background:linear-gradient(180deg,var(--bgFrom) 0%,var(--bgTo) 100%);color:var(--ink);padding:24px 24px 90px}
.pg .bg{position:absolute;inset:0;pointer-events:none}
.pg .blob{position:absolute;border-radius:50%}
.pg .stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--stripe) 0,var(--stripe) 2px,transparent 2px,transparent 46px)}
.back{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--accent);color:var(--ink);background:rgba(255,255,255,.75);font-weight:600;font-size:15px;transition:background .2s,transform .2s}
.back:hover{background:#fff;transform:translateX(3px)}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{position:relative;max-width:1180px;margin:0 auto;min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.top .shapes{position:absolute;inset:0;pointer-events:none;color:var(--shapeInk)}
.top .logo{position:relative;width:210px;max-width:60%;height:auto;display:block;overflow:visible}
.name{position:relative;margin:6px 0 0;font-family:'Aref Ruqaa','Cairo',serif;font-weight:700;font-size:clamp(46px,9vw,96px);line-height:1.2;opacity:0;animation:rise .9s ease 1.3s forwards}
.rule{position:relative;display:flex;align-items:center;gap:10px;width:280px;max-width:80%;opacity:0;animation:rule .8s ease 1.8s forwards}
.rule i{flex:1;height:3px;border-radius:2px}
.rule i:first-child{background:linear-gradient(to left,var(--accent),transparent)}
.rule i:last-child{background:linear-gradient(to right,var(--accent),transparent)}
.rule u{width:11px;height:11px;transform:rotate(45deg);background:var(--accent)}
.sub{position:relative;margin:4px 0 0;font-size:clamp(17px,3vw,22px);font-weight:600;color:var(--inkSoft);opacity:0;animation:rise .9s ease 2s forwards}
.shape{position:absolute;height:auto;opacity:0;filter:drop-shadow(0 10px 14px rgba(10,30,70,.22));animation:pop .8s cubic-bezier(.2,1.4,.4,1) var(--t) forwards,float 6s ease-in-out calc(var(--t) + .9s) infinite alternate}
.shape.ball{animation:drop 1.3s cubic-bezier(.4,0,.6,1) var(--t) forwards,float 5s ease-in-out calc(var(--t) + 1.4s) infinite alternate}
.wins{position:relative;max-width:1100px;margin:8px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start;gap:22px}
.win{--t:3.6s;--dur:7s;min-height:250px;position:relative;overflow:hidden;border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px;background:var(--winBg);border:1px solid rgba(255,255,255,.2);color:#fff;opacity:0;
  box-shadow:0 34px 52px -20px rgba(var(--shadowRGB),.65),0 12px 20px -10px rgba(var(--shadowRGB),.45),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -28px 46px rgba(0,0,0,.2);
  animation:rise 1s cubic-bezier(.2,.8,.2,1) var(--t) forwards,winfloat var(--dur) ease-in-out calc(var(--t) + 1.2s) infinite alternate}
.win:nth-child(even){margin-top:40px}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.04) 36%,rgba(255,255,255,0) 52%);pointer-events:none}
.win::after{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 68%);pointer-events:none}
.win>*{position:relative}
.wico{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center;color:#fff;--sf:rgba(255,255,255,.16)}
.win h3{margin:6px 0 0;font-size:24px;font-weight:800}
.win .d{margin:0;font-size:15px;line-height:1.8;color:var(--winMuted)}
.chip{margin-top:auto;align-self:flex-start;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600}
.mem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mem li{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column}
.mem b{font-weight:600;font-size:16px}
.mem span{font-size:13px;color:var(--winMuted)}
.nw{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:4px}
.nw h4{margin:0;font-size:16px;font-weight:600}
.nw p{margin:0;font-size:14px;line-height:1.8;color:#fff;white-space:pre-line;overflow-wrap:anywhere}
.nw time{font-size:12px;color:var(--winMuted)}
.lst{display:flex;flex-direction:column;gap:8px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-weight:600;font-size:15px;transition:background .2s}
.lk:hover{background:rgba(255,255,255,.26)}
.lk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tx{margin:0;font-size:15px;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}

@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fillin{from{fill-opacity:0;stroke-opacity:1}to{fill-opacity:1;stroke-opacity:0}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(233,185,73,.1))}50%{filter:drop-shadow(0 0 20px rgba(233,185,73,.45))}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes rule{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes slide{0%{transform:translateX(-120%) rotate(-47deg);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateX(120%) rotate(-47deg);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.3) rotate(var(--r))}100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}
@keyframes drop{0%{opacity:0;transform:translateY(-300px) rotate(calc(var(--r) - 200deg))}45%{opacity:1;transform:translateY(0) rotate(var(--r))}62%{transform:translateY(-44px) rotate(var(--r))}78%{transform:translateY(0) rotate(var(--r))}88%{transform:translateY(-14px) rotate(var(--r))}100%{opacity:1;transform:translateY(0) rotate(var(--r))}}
@keyframes float{0%{transform:translateY(0) rotate(var(--r))}100%{transform:translateY(-16px) rotate(calc(var(--r) + 6deg))}}
@keyframes winfloat{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}

@media (max-width:700px){
  .shape{width:56px!important}
  .win:nth-child(even){margin-top:0}
  .top{min-height:420px}
}
@media (prefers-reduced-motion:reduce){
  .logo path{animation:none;stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}
  .home .logo,.card,.hero .tag,.name,.rule,.sub,.win,.shape{animation:none;opacity:1}
  .shape{transform:rotate(var(--r))}
  .ln{display:none}
}
</style>

  function logoSVG(stopA, stopB, accent) {
    var p = LOGO_PATHS.map(function (x) {
      return '<path pathLength="1" style="--d:' + x[1] + 's" d="' + x[0] + '"/>';
    }).join('');
    return '<svg class="logo" role="img" aria-label="شعار دفعة 24" viewBox="0 0 375 220" style="width:560px;max-width:88%;height:auto;display:block;overflow:visible">' +
      '<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + stopA + '"/><stop offset="1" stop-color="' + stopB + '"/></linearGradient></defs>' +
      '<g fill="url(#lg)" stroke="' + accent + '">' + p + '</g></svg>';
  }

  /* ================= البيانات ================= */
  var DEFAULT_AMANAT = [
    ['academic', 'الأمانة الأكاديمية', 'المحاضرات والمواد والامتحانات'],
    ['finance', 'الأمانة المالية', 'موارد الدفعة ومصروفاتها'],
    ['sports', 'الأمانة الرياضية', 'البطولات والأنشطة الرياضية'],
    ['cultural', 'الأمانة الثقافية', 'الندوات والمسابقات والمواهب'],
    ['social', 'الأمانة الاجتماعية', 'الرحلات والمناسبات والتكافل'],
    ['media', 'الأمانة الإعلامية', 'التوثيق والتصميم والنشر'],
    ['general', 'الأمانة العامة', 'تنسيق عمل الأمانات وتمثيل الدفعة'],
    ['president', 'رئيس الدفعة', 'قيادة الدفعة وتمثيلها']
  ].map(function (a, i) { return { id: a[0], name: a[1], tagline: a[2], kind: a[0], sort: i + 1, visible: true }; });

  function defaultBlocks(id) {
    return [
      { id: id + '-1', amana_id: id, type: 'members', title: 'أعضاء الأمانة', description: 'أسماء ومناصب أعضاء الأمانة', icon: 'people', content: {}, sort: 1 },
      { id: id + '-2', amana_id: id, type: 'news', title: 'آخر الأخبار', description: 'أخبار وإعلانات الأمانة', icon: 'bubble', content: {}, sort: 2 },
      { id: id + '-3', amana_id: id, type: 'news', title: 'الأنشطة والفعاليات', description: 'برنامج الأمانة ومواعيدها', icon: 'star', content: {}, sort: 3 },
      { id: id + '-4', amana_id: id, type: 'links', title: 'الملفات والروابط', description: 'ملفات ومراجع الأمانة', icon: 'book', content: {}, sort: 4 }
    ];
  }

  var CFG = window.B24_CONFIG || {};
  var LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
  var DB = { amanat: null, blocks: null, error: false };

  function rest(path) {
    var h = { apikey: CFG.SUPABASE_ANON_KEY };
    // المفاتيح القديمة (JWT) تحتاج Authorization، أما sb_publishable_ فيكفيها apikey
    if (CFG.SUPABASE_ANON_KEY.indexOf('sb_') !== 0) h.Authorization = 'Bearer ' + CFG.SUPABASE_ANON_KEY;
    return fetch(CFG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + path, { headers: h }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function load() {
    if (!LIVE) {
      DB.amanat = DEFAULT_AMANAT;
      DB.blocks = [];
      DEFAULT_AMANAT.forEach(function (a) { DB.blocks = DB.blocks.concat(defaultBlocks(a.id)); });
      return Promise.resolve();
    }
    return Promise.all([
      rest('amanat?select=*&visible=eq.true&order=sort.asc'),
      rest('blocks?select=*&visible=eq.true&order=sort.asc')
    ]).then(function (r) { DB.amanat = r[0]; DB.blocks = r[1]; })
      .catch(function () { DB.error = true; });
  }

  /* ================= عرض ================= */
  function renderHome() {
    document.title = 'دفعة 24';
    document.body.style.background = '#0F1B2D';
    var gold = '#E9B949';
    var cards = DB.amanat.map(function (a, i) {
      return '<a class="card" style="animation-delay:' + (3.2 + i * 0.1) + 's" href="#/a/' + encodeURIComponent(a.id) + '">' +
        '<div><b>' + esc(a.name) + '</b><small>عرض الصفحة</small></div>' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + gold + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>';
    }).join('');
    var body = DB.error
      ? '<p class="status">تعذّر تحميل البيانات. تأكد من الاتصال وحاول مرة أخرى.</p>'
      : '<div class="cards">' + cards + '</div>';
    $app.innerHTML =
      '<main class="home">' +
      '<div class="lines" aria-hidden="true">' +
      '<div class="ln" style="left:12%;background:linear-gradient(to bottom,transparent,' + gold + ',transparent)"></div>' +
      '<div class="ln" style="left:38%;animation-delay:3s;background:linear-gradient(to bottom,transparent,#8AA4D6,transparent)"></div>' +
      '<div class="ln" style="left:62%;animation-delay:6s;background:linear-gradient(to bottom,transparent,' + gold + ',transparent)"></div>' +
      '<div class="ln" style="left:86%;animation-delay:1.5s;background:linear-gradient(to bottom,transparent,#8AA4D6,transparent)"></div></div>' +
      '<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0">دفعة 24 — الصفحة الرئيسية</h1>' +
      '<div class="hero">' + logoSVG('#FFFFFF', '#C5D0E3', gold) + '<p class="tag">روحٌ تتشابك للتطوّر، وأثرٌ يخلّد الإرث</p></div>' +
      '<section class="sec"><h2>أمانات الدفعة</h2>' + body + '</section></main>';
  }

  function iconSym(name) { return '<svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><use href="#i-' + esc(name) + '"/></svg>'; }

  function blockBody(b) {
    var c = b.content || {};
    var items = Array.isArray(c.items) ? c.items : [];
    if (b.type === 'members') {
      items = items.filter(function (m) { return m && m.name; });
      if (!items.length) return '';
      return '<ul class="mem">' + items.map(function (m) {
        return '<li><b>' + esc(m.name) + '</b>' + (m.role ? '<span>' + esc(m.role) + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    if (b.type === 'news') {
      items = items.filter(function (n) { return n && (n.title || n.body); });
      if (!items.length) return '';
      return '<div class="lst">' + items.map(function (n) {
        return '<article class="nw">' + (n.title ? '<h4>' + esc(n.title) + '</h4>' : '') +
          (n.body ? '<p>' + esc(n.body) + '</p>' : '') + (n.date ? '<time>' + esc(n.date) + '</time>' : '') + '</article>';
      }).join('') + '</div>';
    }
    if (b.type === 'links') {
      items = items.filter(function (l) { return l && l.label && l.url; });
      if (!items.length) return '';
      return '<div class="lst">' + items.map(function (l) {
        return '<a class="lk" href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer"><span>' + esc(l.label) +
          '</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>';
      }).join('') + '</div>';
    }
    if (b.type === 'text') return c.text ? '<p class="tx">' + esc(c.text) + '</p>' : '';
    return '';
  }

  function renderAmana(id) {
    var a = DB.amanat.filter(function (x) { return x.id === id; })[0];
    if (!a) {
      $app.innerHTML = '<main class="home"><p class="status">الصفحة غير موجودة.</p><a class="card" style="animation-delay:.2s" href="#/"><b>الرئيسية</b></a></main>';
      return;
    }
    document.title = a.name + ' — دفعة 24';
    var th = a.kind === 'sports' ? GREEN : BLUE;
    document.body.style.background = th.bgTo;
    var vars = Object.keys(th).map(function (k) { return '--' + k + ':' + th[k]; }).join(';');
    var kind = SHAPES[a.kind] ? a.kind : 'general';
    var shapes = SHAPES[kind].map(function (s, i) {
      var p = POS[i];
      return '<svg class="shape' + (kind === 'sports' ? ' ball' : '') + '" viewBox="0 0 64 64" style="left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + 'px;--t:' + p[4] + 's;--r:' + p[3] + 'deg"><use href="#i-' + s + '"/></svg>';
    }).join('');
    var blocks = DB.blocks.filter(function (b) { return b.amana_id === id; });
    var wins = blocks.map(function (b, i) {
      var inner = blockBody(b);
      return '<section class="win" style="--t:' + (3.4 + i * 0.2) + 's;--dur:' + (6 + (i % 3) * 1.2) + 's">' +
        '<div class="wico">' + iconSym(b.icon) + '</div>' +
        '<h3>' + esc(b.title) + '</h3>' +
        (b.description ? '<p class="d">' + esc(b.description) + '</p>' : '') +
        (inner || '<span class="chip">قريباً</span>') + '</section>';
    }).join('');
    $app.innerHTML =
      '<main class="pg" style="' + vars + '">' +
      '<div class="bg" aria-hidden="true">' +
      '<div class="blob" style="left:-160px;top:-120px;width:520px;height:520px;background:radial-gradient(circle,' + th.blob + ' 0%,transparent 70%)"></div>' +
      '<div class="blob" style="right:-180px;top:420px;width:640px;height:640px;background:radial-gradient(circle,' + th.blob + ' 0%,transparent 70%)"></div>' +
      '<div class="stripes"></div></div>' +
      '<a class="back" href="#/"><span>الرئيسية</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + th.accent + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>' +
      '<div class="top"><div class="shapes" aria-hidden="true">' + shapes + '</div>' +
      logoSVG(th.logoA, th.logoB, th.accent).replace('width:560px;max-width:88%', 'width:210px;max-width:60%') +
      '<h1 class="name">' + esc(a.name) + '</h1>' +
      '<div class="rule" aria-hidden="true"><i></i><u></u><i></i></div>' +
      (a.tagline ? '<p class="sub">' + esc(a.tagline) + '</p>' : '') + '</div>' +
      '<div class="wins">' + wins + '</div></main>';
  }

  function route() {
    window.scrollTo(0, 0);
    if (!DB.amanat) return;
    var m = location.hash.match(/^#\/a\/([^/?]+)/);
    if (m) renderAmana(decodeURIComponent(m[1])); else renderHome();
  }
  window.addEventListener('hashchange', route);
  $app.innerHTML = '<main class="home"><p class="status">جارٍ التحميل…</p></main>';
  load().then(route);
})();
</script>
</body>
</html>
