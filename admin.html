<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة — دفعة 24</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--navy:#0E1E45;--or:#F58A1F;--or2:#FFB25E;--mut:#C9D4EC;--bad:#C0264B;--gl:rgba(14,30,69,.5);--ln:rgba(255,255,255,.22)}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:linear-gradient(160deg,#1E4396,#14295A 55%,#0E1E45) fixed;color:#fff;line-height:1.7;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.pgbg{position:fixed;inset:-12px;z-index:0;background-size:cover;background-position:center;filter:blur(3px)}
.pgov{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 0%,rgba(245,138,31,.2),transparent 45%),linear-gradient(180deg,rgba(14,30,69,.4),rgba(14,30,69,.82))}
header.bar,.wrap{position:relative;z-index:1}
header.bar{background:rgba(14,30,69,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.bar b{font-size:18px}
header.bar .who{margin-inline-start:auto;font-size:14px;color:var(--mut)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--gl);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--ln);border-radius:24px;padding:20px;box-shadow:0 24px 46px -22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.login{max-width:400px;margin:70px auto;position:relative;z-index:1}
.login h1{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 14px;color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=datetime-local],select,textarea{width:100%;padding:9px 12px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
input[type=file]{width:100%;font-size:13px}
select option{color:var(--navy)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(245,138,31,.5);border-color:var(--or2)}
::placeholder{color:#AEBBD6}
.btn{border:0;border-radius:12px;padding:9px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#FFB25E,#F58A1F);color:var(--navy)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--ln);font-weight:600}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:8px 18px;border-radius:999px;border:1px solid var(--ln);background:var(--gl);backdrop-filter:blur(12px);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--or);color:var(--navy);border-color:var(--or)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px}
.side button{text-align:start;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--gl);backdrop-filter:blur(12px);cursor:pointer;font-weight:600}
.side button.on{background:var(--or);color:var(--navy);border-color:var(--or)}
.side button.off{opacity:.55}
.h2{margin:0 0 4px;font-size:20px}
.muted{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
.row>.fit{flex:0 0 auto}
.blk{margin-top:16px;border-top:4px solid var(--or)}
.blk.hid{border-top-color:#8C98B4;opacity:.8}
.blk .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.badge{padding:3px 12px;border-radius:999px;background:rgba(245,138,31,.22);border:1px solid rgba(255,178,94,.5);color:#FFD9AE;font-size:13px;font-weight:600}
.item{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:10px;border:1px dashed rgba(255,255,255,.3);border-radius:14px;margin-top:8px;background:rgba(255,255,255,.06)}
.item .full{grid-column:1/-1}
.item label{margin-top:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.tools .sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin:0;color:#fff}
.chk input{width:18px;height:18px;accent-color:var(--or)}
.pv{max-width:180px;max-height:120px;border-radius:10px;display:block;margin:4px 0;object-fit:cover}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:start;vertical-align:middle;font-size:14px}
th{color:var(--mut);font-weight:600}
td select{min-width:150px}
.res{margin-top:18px;padding:16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--ln)}
.res h3{margin:0 0 8px;font-size:17px}
.res h4{margin:16px 0 4px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{padding:10px 12px;border-radius:14px;background:rgba(14,30,69,.5);border:1px solid rgba(255,178,94,.4)}
.stat b{display:block;font-size:24px;color:var(--or2);line-height:1.2}
.stat span{font-size:12px;color:var(--mut)}
.rb{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:8px;font-size:14px}
.rb i{grid-column:1/-1;height:9px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.rb s{display:block;height:100%;background:linear-gradient(90deg,#F58A1F,#FFB25E)}
.tl{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.tl li{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.days{display:flex;align-items:flex-end;gap:5px;height:118px;margin-top:10px}
.dc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.dc em{font-style:normal;font-size:12px;font-weight:600}
.dc span{display:block;width:100%;max-width:30px;border-radius:5px 5px 0 0;background:linear-gradient(#FFB25E,#F58A1F)}
.dc small{font-size:10px;color:var(--mut)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--or2);color:#fff;padding:11px 22px;border-radius:12px;font-weight:600;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.err{background:var(--bad);border-color:var(--bad)}
.note{padding:14px 16px;border-radius:14px;background:rgba(245,138,31,.16);border:1px solid rgba(255,178,94,.5);color:#FFE6C7;margin-top:14px}
.err{color:#FFB3C4;font-size:14px;margin-top:10px;min-height:1.4em}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}.item{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  'use strict';
  var root = document.getElementById('root'), CFG = window.B24_CONFIG || {};
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  };

  var TYPES = { members: 'أعضاء / أسماء', news: 'أخبار وإعلانات', event: 'فعالية قادمة', links: 'روابط', text: 'نص حر' };
  var ICONS = { people: 'أشخاص', bubble: 'رسالة', star: 'نجمة', book: 'كتاب', link: 'رابط', calendar: 'تقويم', bell: 'جرس', bulb: 'فكرة', cap: 'تخرج', pencil: 'قلم', coin: 'عملة', bars: 'مخطط', wallet: 'محفظة', soccer: 'كرة قدم', basket: 'كرة سلة', tennis: 'تنس', quill: 'ريشة', heart: 'قلب', camera: 'كاميرا', play: 'تشغيل', mic: 'ميكروفون', shield: 'درع', gear: 'ترس', crown: 'تاج' };
  var DEFICON = { members: 'people', news: 'bubble', event: 'calendar', links: 'link', text: 'star' };
  var KINDS = { academic: 'أكاديمية', finance: 'مالية', sports: 'رياضية', cultural: 'ثقافية', social: 'اجتماعية', media: 'إعلامية', general: 'عامة', president: 'الرئيس' };
  var NEWN = { members: 'member', links: 'link', news: 'news', event: 'event' };
  var ADDL = { members: 'إضافة اسم', links: 'إضافة رابط', news: 'إضافة خبر أو إعلان', event: 'إضافة فعالية' };
  var QT = { single: 'اختيار واحد', multi: 'اختيار متعدد', text: 'إجابة نصية' };
  var uid = function () { return Math.random().toString(36).slice(2, 10); };
  var NEW = {
    member: function () { return { name: '', role: '' }; },
    link: function () { return { label: '', url: 'https://' }; },
    news: function () { return { kind: 'news', title: '', body: '', date: '', image: '' }; },
    event: function () { return { title: '', body: '', date: '', countdown: true }; },
    q: function () { return { id: uid(), text: '', type: 'single', opt: '' }; }
  };

  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) {
    root.innerHTML = '<div class="card login"><h1>لوحة الإدارة</h1><p>لم يتم ربط قاعدة البيانات بعد. ضع رابط المشروع والمفتاح العام في أول الملف (B24_CONFIG).</p></div>';
    return;
  }
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  var S = { me: null, email: '', amanat: [], sel: null, blocks: [], tab: 'pages', users: [], surveys: [], resp: {}, clubs: [], members: {} };

  /* ---------- أدوات ---------- */
  function gp(p) { return p.split('.').reduce(function (o, k) { return o[k]; }, S); }
  function sp(p, v) { var a = p.split('.'), k = a.pop(); a.reduce(function (o, x) { return o[x]; }, S)[k] = v; }
  function toast(msg, bad) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'toast' + (bad ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
  }
  function fail(e) { toast('تعذّر: ' + ((e && e.message) || e), true); }
  function must(r) { if (r.error) throw r.error; return r; }
  function toLocal(iso) { var d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
  function fd(iso) { return new Date(iso).toLocaleString('ar-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }); }
  function isSuper() { return S.me && S.me.role === 'super'; }
  function canSv() { return isSuper() || ['social', 'media'].indexOf(S.me.amana_id) > -1; }
  function canCl() { return isSuper() || S.me.amana_id === 'cultural'; }
  function csv(name, head, rows) {
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var txt = '\ufeff' + [head].concat(rows).map(function (r) { return r.map(q).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
    a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var im = new Image(), u = URL.createObjectURL(file);
      im.onload = function () {
        var r = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = im.width * r; c.height = im.height * r; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? res(b) : rej(new Error('تعذّرت معالجة الصورة')); }, 'image/jpeg', .82);
      };
      im.onerror = function () { rej(new Error('ملف الصورة غير صالح')); };
      im.src = u;
    });
  }

  /* ---------- عناصر النماذج (مرتبطة بمسار في الحالة) ---------- */
  function F(p, label, o) {
    o = o || {}; var v = gp(p);
    return '<div' + (o.full ? ' class="full"' : '') + '><label>' + label + '</label>' +
      (o.ta ? '<textarea data-p="' + p + '"' + (o.ph ? ' placeholder="' + o.ph + '"' : '') + '>' + esc(v) + '</textarea>'
        : '<input type="' + (o.t || 'text') + '"' + (o.dir ? ' dir="ltr"' : '') + ' data-p="' + p + '" value="' + esc(v) + '">') + '</div>';
  }
  function CK(p, label, tog) { return '<label class="chk"><input type="checkbox" data-p="' + p + '"' + (tog ? ' data-tog="1"' : '') + (gp(p) ? ' checked' : '') + '> ' + label + '</label>'; }
  function SEL(p, label, map, o) {
    var v = gp(p);
    return '<div' + (o && o.fit ? ' class="fit"' : '') + '><label>' + label + '</label><select data-p="' + p + '">' + Object.keys(map).map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + map[k] + '</option>'; }).join('') + '</select></div>';
  }
  function IMG(p, label) {
    var v = gp(p);
    return '<div class="full"><label>' + label + '</label>' + (v ? '<img class="pv" alt="" src="' + esc(v) + '"><button class="btn ghost sm" data-act="rmimg" data-p="' + p + '">إزالة الصورة</button>' : '') +
      '<input type="file" accept="image/*" data-up="' + p + '"></div>';
  }
  function DEL(p) { return '<button class="btn bad sm" data-act="del" data-p="' + p + '">حذف</button>'; }

  function itemHTML(type, p) {
    if (type === 'members') return '<div class="item">' + F(p + '.name', 'الاسم') + F(p + '.role', 'المنصب') + DEL(p) + '</div>';
    if (type === 'links') return '<div class="item">' + F(p + '.label', 'عنوان الرابط') + F(p + '.url', 'الرابط (https://...)', { t: 'url', dir: 1 }) + DEL(p) + '</div>';
    if (type === 'event') return '<div class="item">' + F(p + '.title', 'اسم الفعالية') + F(p + '.date', 'موعد الفعالية', { t: 'datetime-local', dir: 1 }) + DEL(p) +
      F(p + '.body', 'وصف الفعالية', { ta: 1, full: 1 }) + '<div class="full">' + CK(p + '.countdown', 'إظهار عدّاد تنازلي للزوار') + '</div></div>';
    return '<div class="item">' + F(p + '.title', 'العنوان') + F(p + '.date', 'التاريخ (اختياري)') + DEL(p) +
      '<div class="full">' + '<label>النوع</label><select data-p="' + p + '.kind"><option value="news"' + (gp(p).kind !== 'ad' ? ' selected' : '') + '>خبر</option><option value="ad"' + (gp(p).kind === 'ad' ? ' selected' : '') + '>إعلان</option></select></div>' +
      F(p + '.body', 'النص', { ta: 1, full: 1 }) + IMG(p + '.image', 'صورة (اختياري)') + '</div>';
  }
  function listHTML(type, lp) {
    return gp(lp).map(function (it, i) { return itemHTML(type, lp + '.' + i); }).join('') +
      '<div style="margin-top:10px"><button class="btn ghost sm" data-act="add" data-p="' + lp + '" data-n="' + NEWN[type] + '">+ ' + ADDL[type] + '</button></div>';
  }

  /* ---------- الدخول والإقلاع ---------- */
  function layers(kind) {
    var img = (window.B24_BG || {})[kind] || '';
    return img ? '<div class="pgbg" style="background-image:url(' + esc(img) + ')"></div><div class="pgov"></div>' : '<div class="pgov"></div>';
  }
  function showLogin(msg) {
    root.innerHTML = layers('social') + '<div class="card login"><h1>لوحة الإدارة</h1><p>دفعة 24 — دخول الأمناء والإدارة</p>' +
      '<form id="lf"><label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" required dir="ltr">' +
      '<label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password" required dir="ltr">' +
      '<div class="err" id="le">' + esc(msg || '') + '</div><button class="btn" type="submit" style="width:100%;margin-top:6px">دخول</button></form></div>';
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault();
      var btn = e.target.querySelector('button'); btn.disabled = true;
      sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (r) {
        if (r.error) { document.getElementById('le').textContent = 'البريد أو كلمة السر غير صحيحة'; btn.disabled = false; return; }
        boot();
      });
    };
  }
  function boot() {
    sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session;
      if (!s) return showLogin();
      S.email = s.user.email;
      return sb.from('profiles').select('*').eq('id', s.user.id).maybeSingle().then(function (p) {
        must(p); S.me = p.data;
        if (!S.me) return renderShell('<div class="card"><h2 class="h2">حسابك غير مفعّل</h2><p class="muted">تواصل مع مدير الدفعة.</p></div>', 'general');
        return sb.from('amanat').select('*').order('sort').then(function (a) {
          must(a); S.amanat = a.data;
          if (isSuper()) S.sel = S.amanat.length ? S.amanat[0].id : null;
          else { S.amanat = S.amanat.filter(function (x) { return x.id === S.me.amana_id; }); S.sel = S.me.amana_id; }
          return loadBlocks().then(render);
        });
      });
    }).catch(fail);
  }
  function loadBlocks() {
    if (!S.sel) { S.blocks = []; return Promise.resolve(); }
    return sb.from('blocks').select('*').eq('amana_id', S.sel).order('sort').then(function (r) {
      must(r);
      S.blocks = r.data.map(function (b) { b.content = b.content || {}; if (b.type === 'text') b.content.text = b.content.text || ''; else b.content.items = Array.isArray(b.content.items) ? b.content.items : []; return b; });
    });
  }
  function loadSurveys() {
    return sb.from('surveys').select('*').order('created_at', { ascending: false }).then(function (r) {
      must(r);
      S.surveys = r.data.map(function (s) {
        s.questions = (s.questions || []).map(function (q) { q.opt = (q.options || []).join('\n'); return q; });
        s.ends_local = s.ends_at ? toLocal(s.ends_at) : ''; return s;
      });
      S.resp = {};
      var ids = S.surveys.map(function (s) { return s.id; });
      if (!ids.length) return;
      return sb.from('survey_responses').select('survey_id,answers,created_at').in('survey_id', ids).order('created_at', { ascending: false }).limit(5000).then(function (x) {
        must(x); x.data.forEach(function (row) { (S.resp[row.survey_id] = S.resp[row.survey_id] || []).push(row); });
      });
    });
  }
  function loadClubs() {
    return sb.from('clubs').select('*').order('created_at').then(function (r) {
      must(r);
      S.clubs = r.data.map(function (c) { c.news = Array.isArray(c.news) ? c.news : []; c.description = c.description || ''; c.image_url = c.image_url || ''; return c; });
      S.members = {};
      var ids = S.clubs.map(function (c) { return c.id; });
      if (!ids.length) return;
      return sb.from('club_members').select('*').in('club_id', ids).order('created_at', { ascending: false }).limit(5000).then(function (x) {
        must(x); x.data.forEach(function (m) { (S.members[m.club_id] = S.members[m.club_id] || []).push(m); });
      });
    });
  }

  /* ---------- الواجهة ---------- */
  function kindNow() {
    if (S.tab === 'surveys') return 'social';
    if (S.tab === 'clubs') return 'cultural';
    var a = S.amanat.filter(function (x) { return x.id === S.sel; })[0]; return a ? a.kind : 'general';
  }
  function renderShell(inner, kind) {
    root.innerHTML = layers(kind || kindNow()) + '<header class="bar"><b>لوحة إدارة دفعة 24</b><span class="who">' + esc(S.email) + ' — ' + (isSuper() ? 'المدير العام' : 'أمين') + '</span>' +
      '<a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">عرض الموقع</a><button class="btn ghost sm" data-act="logout">خروج</button></header><div class="wrap">' + inner + '</div>';
  }
  function render() {
    if (!isSuper() && !S.me.amana_id) return renderShell('<div class="card"><h2 class="h2">لم يتم ربط حسابك بأمانة بعد</h2><p class="muted">اطلب من مدير الدفعة أن يربط حسابك بأمانتك.</p></div>', 'general');
    var tabs = [['pages', 'صفحة الأمانة']];
    if (canSv()) tabs.push(['surveys', 'الاستبيانات']);
    if (canCl()) tabs.push(['clubs', 'النوادي']);
    if (isSuper()) tabs.push(['users', 'الأمناء والحسابات']);
    var h = tabs.length > 1 ? '<div class="tabs">' + tabs.map(function (t) { return '<button data-act="tab" data-v="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' : '';
    if (S.tab === 'users') { renderShell(h + '<div id="users" class="card"><p class="muted">جارٍ التحميل…</p></div>'); return loadUsers(); }
    if (S.tab === 'surveys') return renderShell(h + surveysHTML());
    if (S.tab === 'clubs') return renderShell(h + clubsHTML());
    renderShell(h + pagesHTML());
  }

  function pagesHTML() {
    var a = S.amanat.filter(function (x) { return x.id === S.sel; })[0], side = '', main;
    if (isSuper()) side = '<nav class="side" aria-label="الأمانات">' + S.amanat.map(function (x) {
      return '<button data-act="sel" data-v="' + esc(x.id) + '" class="' + (x.id === S.sel ? 'on' : '') + (x.visible ? '' : ' off') + '">' + esc(x.name) + '</button>';
    }).join('') + '</nav>';
    if (!a) main = '<div class="card">لا توجد أمانة.</div>';
    else {
      main = '<div class="card"><h2 class="h2">' + esc(a.name) + '</h2><p class="muted">أنت تعدّل صفحة هذه الأمانة. التعديلات تظهر للزوار بعد الضغط على «حفظ» في كل نافذة.</p>';
      if (isSuper()) {
        main += '<div class="row"><div><label>اسم الأمانة</label><input type="text" id="an" value="' + esc(a.name) + '"></div><div><label>الجملة تحت الاسم</label><input type="text" id="at" value="' + esc(a.tagline) + '"></div>' +
          '<div class="fit"><label>النوع (يحدد الخلفية)</label><select id="ak">' + Object.keys(KINDS).map(function (k) { return '<option value="' + k + '"' + (a.kind === k ? ' selected' : '') + '>' + KINDS[k] + '</option>'; }).join('') + '</select></div>' +
          '<div class="fit"><label class="chk"><input type="checkbox" id="av"' + (a.visible ? ' checked' : '') + '> ظاهرة للزوار</label></div><div class="fit"><button class="btn" data-act="saveAmana">حفظ الأمانة</button></div></div>';
      }
      main += '<hr style="border:0;border-top:1px solid var(--ln);margin:18px 0 6px"><div class="row"><div><label>إضافة نافذة جديدة — العنوان</label><input type="text" id="nt" placeholder="مثال: إعلانات مهمة"></div>' +
        '<div class="fit"><label>النوع</label><select id="ny">' + Object.keys(TYPES).map(function (k) { return '<option value="' + k + '">' + TYPES[k] + '</option>'; }).join('') + '</select></div>' +
        '<div class="fit"><button class="btn" data-act="addBlock">+ إضافة النافذة</button></div></div></div>';
      main += S.blocks.map(blockHTML).join('') || '<div class="card" style="margin-top:16px"><p class="muted">لا توجد نوافذ بعد. أضف أول نافذة من الأعلى.</p></div>';
    }
    return isSuper() ? '<div class="layout">' + side + '<div>' + main + '</div></div>' : main;
  }

  function blockHTML(b, i) {
    var p = 'blocks.' + i, h = '<section class="card blk' + (b.visible ? '' : ' hid') + '"><div class="head"><span class="badge">' + (TYPES[b.type] || b.type) + '</span>' +
      '<span style="margin-inline-start:auto">' + CK(p + '.visible', 'ظاهرة', 1) + '</span></div>' +
      '<div class="row">' + F(p + '.title', 'عنوان النافذة') + SEL(p + '.icon', 'الأيقونة', ICONS, { fit: 1 }) + '</div>' + F(p + '.description', 'وصف قصير');
    h += b.type === 'text' ? F(p + '.content.text', 'النص', { ta: 1 }) : listHTML(b.type, p + '.content.items');
    return h + '<div class="tools"><button class="btn" data-act="saveBlock" data-b="' + i + '">حفظ</button>' +
      '<button class="btn ghost sm" data-act="up" data-b="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑ للأعلى</button>' +
      '<button class="btn ghost sm" data-act="down" data-b="' + i + '"' + (i === S.blocks.length - 1 ? ' disabled' : '') + '>↓ للأسفل</button>' +
      '<span class="sp"></span><button class="btn bad sm" data-act="delBlock" data-b="' + i + '">حذف النافذة</button></div></section>';
  }

  /* ---------- إحصائيات ---------- */
  function dayBars(rows) {
    var m = {}; rows.forEach(function (r) { var k = new Date(r.created_at).toLocaleDateString('en-CA'); m[k] = (m[k] || 0) + 1; });
    var ks = Object.keys(m).sort().slice(-14); if (!ks.length) return '';
    var mx = Math.max.apply(null, ks.map(function (k) { return m[k]; }));
    return '<h4>' + 'عدد الردود حسب اليوم' + '</h4><div class="days">' + ks.map(function (k) {
      return '<div class="dc"><em>' + m[k] + '</em><span style="height:' + Math.max(4, m[k] / mx * 70) + 'px"></span><small>' + k.slice(5) + '</small></div>';
    }).join('') + '</div>';
  }
  function stat(l, v) { return '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>'; }
  function qResult(q, rs) {
    var vals = rs.map(function (r) { return r.answers && r.answers[q.id]; }).filter(function (v) { return v != null && v !== ''; });
    if (q.type === 'text') return '<h4>' + esc(q.text) + ' <span class="muted">(' + vals.length + ' إجابة)</span></h4>' +
      (vals.length ? '<ul class="tl">' + vals.slice(0, 40).map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') + '</ul>' : '<p class="muted">لا إجابات بعد</p>');
    var c = {}; (q.options || []).forEach(function (o) { c[o] = 0; });
    vals.forEach(function (v) { [].concat(v).forEach(function (o) { c[o] = (c[o] || 0) + 1; }); });
    var tot = vals.length || 1;
    return '<h4>' + esc(q.text) + ' <span class="muted">(' + vals.length + ' إجابة)</span></h4>' + Object.keys(c).map(function (o) {
      return '<div class="rb"><span>' + esc(o) + '</span><b>' + c[o] + ' — ' + Math.round(c[o] / tot * 100) + '%</b><i><s style="width:' + (c[o] / tot * 100) + '%"></s></i></div>';
    }).join('');
  }

  /* ---------- الاستبيانات ---------- */
  function surveysHTML() {
    var h = '<div class="card"><h2 class="h2">الاستبيانات واستطلاعات الرأي</h2><p class="muted">تظهر في صفحة الأمانة الاجتماعية، ويُسمح بردّ واحد لكل جهاز. لكل استبيان خانة نتائج خاصة به.</p>' +
      '<div class="row"><div><label>موضوع الاستبيان / عنوانه</label><input type="text" id="nst" placeholder="مثال: وجهة رحلة نهاية الفصل"></div>' +
      '<div class="fit"><label>النوع</label><select id="nsk"><option value="poll">استطلاع رأي (سؤال واحد)</option><option value="survey">استبيان (عدة أسئلة)</option></select></div>' +
      '<div class="fit"><button class="btn" data-act="newSurvey">+ إنشاء</button></div></div></div>';
    return h + (S.surveys.map(surveyHTML).join('') || '<div class="card" style="margin-top:16px"><p class="muted">لا توجد استبيانات بعد.</p></div>');
  }
  function surveyHTML(s, i) {
    var p = 'surveys.' + i, rs = S.resp[s.id] || [];
    var h = '<section class="card blk' + (s.open ? '' : ' hid') + '"><div class="head"><span class="badge">' + (s.kind === 'poll' ? 'استطلاع رأي' : 'استبيان') + '</span><span class="badge">' + rs.length + ' رد</span>' +
      '<span style="margin-inline-start:auto">' + CK(p + '.open', 'مفتوح للردود', 1) + '</span></div>' +
      '<div class="row">' + F(p + '.title', 'عنوان الاستبيان') + F(p + '.topic', 'الموضوع / وصف قصير') + '</div>' +
      '<div class="row">' + SEL(p + '.kind', 'النوع', { poll: 'استطلاع رأي (سؤال واحد)', survey: 'استبيان (عدة أسئلة)' }) + F(p + '.ends_local', 'ينتهي في (اختياري)', { t: 'datetime-local', dir: 1 }) + '</div>';
    s.questions.forEach(function (q, j) {
      var qp = p + '.questions.' + j;
      h += '<div class="item">' + F(qp + '.text', 'السؤال ' + (j + 1)) + SEL(qp + '.type', 'نوع الإجابة', QT) + DEL(qp) +
        (q.type === 'text' ? '' : F(qp + '.opt', 'الخيارات — اكتب كل خيار في سطر', { ta: 1, full: 1, ph: 'خيار 1&#10;خيار 2' })) + '</div>';
    });
    if (s.kind !== 'poll' || !s.questions.length) h += '<div style="margin-top:10px"><button class="btn ghost sm" data-act="add" data-p="' + p + '.questions" data-n="q">+ إضافة سؤال</button></div>';
    h += '<div class="tools"><button class="btn" data-act="saveSurvey" data-s="' + i + '">حفظ الاستبيان</button><button class="btn ghost sm" data-act="csvSurvey" data-s="' + i + '">تصدير CSV</button>' +
      '<span class="sp"></span><button class="btn bad sm" data-act="delSurvey" data-s="' + i + '">حذف</button></div>';
    h += '<div class="res"><h3>النتائج والإحصائيات</h3><div class="stats">' + stat('عدد الردود', rs.length) + stat('آخر رد', rs.length ? fd(rs[0].created_at) : '—') + '</div>';
    h += rs.length ? dayBars(rs) + (s.questions.map(function (q) { return qResult(q, rs); }).join('')) : '<p class="muted">لا توجد ردود بعد.</p>';
    return h + '</div></section>';
  }
  function surveyPayload(s) {
    var qs = s.questions.map(function (q) {
      return { id: q.id, text: (q.text || '').trim(), type: q.type, options: q.type === 'text' ? [] : (q.opt || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean) };
    }).filter(function (q) { return q.text; });
    if (s.kind === 'poll') qs = qs.slice(0, 1);
    if (!(s.title || '').trim()) throw new Error('عنوان الاستبيان مطلوب');
    if (!qs.length) throw new Error('أضف سؤالاً واحداً على الأقل');
    qs.forEach(function (q) { if (q.type !== 'text' && q.options.length < 2) throw new Error('السؤال «' + q.text + '» يحتاج خيارين على الأقل'); });
    return { qs: qs, row: { title: s.title.trim(), topic: (s.topic || '').trim(), kind: s.kind, questions: qs, open: !!s.open, ends_at: s.ends_local ? new Date(s.ends_local).toISOString() : null } };
  }

  /* ---------- النوادي ---------- */
  function clubsHTML() {
    var h = '<div class="card"><h2 class="h2">النوادي</h2><p class="muted">تظهر في صفحة الأمانة الثقافية. لكل نادٍ صفحة بأخباره ونموذج تسجيل، وقائمة المسجّلين تظهر لك هنا فقط.</p>' +

    return h + (S.clubs.map(clubHTML).join('') || '<div class="card" style="margin-top:16px"><p class="muted">لا توجد نوادٍ بعد.</p></div>');
  }

      '<span style="margin-inline-start:auto">' + CK(p + '.open', 'التسجيل مفتوح', 1) + '</span></div>' +

      '<div class="tools"><button class="btn" data-act="saveClub" data-s="' + i + '">حفظ النادي</button><button class="btn ghost sm" data-act="csvClub" data-s="' + i + '">تصدير المسجّلين CSV</button>' +
      '<span class="sp"></span><button class="btn bad sm" data-act="delClub" data-s="' + i + '">حذف النادي</button></div>' +
      '<div class="res"><h3>المسجّلون وإحصائياتهم</h3><div class="stats">' + stat('عدد المسجّلين', ms.length) + stat('آخر تسجيل', ms.length ? fd(ms[0].created_at) : '—') + '</div>';
    if (!ms.length) return h + '<p class="muted">لا يوجد مسجّلون بعد.</p></div></section>';
    return h + dayBars(ms) + '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>الاسم</th><th>رقم التواصل</th><th>البريد</th><th>التاريخ</th></tr></thead><tbody>' +

      '</tbody></table></div></div></section>';
  }

  /* ---------- المستخدمون ---------- */
  function loadUsers() {
    sb.from('profiles').select('*').order('email').then(function (r) {
      if (r.error) return fail(r.error);
      S.users = r.data;
      var opts = function (sel) { return '<option value="">— بدون أمانة —</option>' + S.amanat.map(function (a) { return '<option value="' + esc(a.id) + '"' + (sel === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join(''); };
      var rows = S.users.map(function (u, i) {
        var me = u.id === S.me.id;
        return '<tr><td dir="ltr" style="text-align:start">' + esc(u.email) + (me ? ' <span class="badge">أنت</span>' : '') + '</td>' +
          '<td><select data-p="users.' + i + '.role"' + (me ? ' disabled' : '') + '><option value="amin"' + (u.role === 'amin' ? ' selected' : '') + '>أمين</option><option value="super"' + (u.role === 'super' ? ' selected' : '') + '>مدير عام</option></select></td>' +
          '<td><select data-p="users.' + i + '.amana_id"' + (u.role === 'super' ? ' disabled' : '') + '>' + opts(u.amana_id) + '</select></td>' +
          '<td><button class="btn sm" data-act="saveUser" data-u="' + i + '">حفظ</button></td></tr>';
      }).join('');
      document.getElementById('users').innerHTML = '<h2 class="h2">الأمناء والحسابات</h2><p class="muted">اربط كل أمين بأمانته. تغيير الأمانة يسحب صلاحية الأمين القديم فوراً ويعطيها للجديد. الأمين الاجتماعي والإعلامي يديران الاستبيانات، والثقافي يدير النوادي.</p>' +
        '<div style="overflow-x:auto"><table><thead><tr><th>البريد</th><th>الصلاحية</th><th>الأمانة</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="note"><b>لإضافة أمين جديد:</b> من لوحة Supabase ← Authentication ← Users ← Add user (بريد وكلمة سر)، ثم ارجع هنا وحدّث الصفحة وسيظهر في الجدول لتربطه بأمانته.</div>';
    });
  }

  /* ---------- الأحداث ---------- */
  root.addEventListener('input', function (e) {
    var t = e.target, p = t.dataset.p; if (!p) return;
    var v = t.type === 'checkbox' ? t.checked : t.value;
    sp(p, v);
    if (t.dataset.tog) t.closest('.blk').classList.toggle('hid', !v);
    if (/^users\.\d+\.role$/.test(p)) t.closest('tr').querySelectorAll('select')[1].disabled = v === 'super';
  });
  root.addEventListener('change', function (e) {
    var t = e.target, p = t.dataset.up; if (!p || !t.files[0]) return;
    toast('جارٍ رفع الصورة…');
    shrink(t.files[0]).then(function (b) {
      var path = (S.me.amana_id || 'admin') + '/' + Date.now() + '-' + uid().slice(0, 5) + '.jpg';
      return sb.storage.from('media').upload(path, b, { contentType: 'image/jpeg' }).then(function (r) {
        must(r); sp(p, sb.storage.from('media').getPublicUrl(path).data.publicUrl); toast('تم رفع الصورة'); render();
      });
    }).catch(fail);
  });

  function renumber() {
    var jobs = [];
    S.blocks.forEach(function (b, i) { if (b.sort !== i + 1) { b.sort = i + 1; jobs.push(sb.from('blocks').update({ sort: b.sort }).eq('id', b.id)); } });
    return Promise.all(jobs).then(function (rs) { rs.forEach(must); });
  }
  function clean(items) {
    return items.filter(function (it) { return Object.keys(it).some(function (k) { var v = it[k]; return typeof v === 'string' && v.trim() && !(k === 'url' && v === 'https://') && k !== 'kind'; }); });
  }

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var act = el.dataset.act, d = el.dataset, b = S.blocks[+d.b];
    if (act === 'logout') return sb.auth.signOut().then(function () { S.me = null; showLogin(); });
    if (act === 'tab') {
      S.tab = d.v; var pr = d.v === 'surveys' ? loadSurveys() : d.v === 'clubs' ? loadClubs() : Promise.resolve();
      return pr.then(render).catch(fail);
    }
    if (act === 'sel') { S.sel = d.v; return loadBlocks().then(render).catch(fail); }
    if (act === 'add') { gp(d.p).push(NEW[d.n]()); return render(); }
    if (act === 'del') { var a = d.p.split('.'), idx = +a.pop(); gp(a.join('.')).splice(idx, 1); return render(); }
    if (act === 'rmimg') { sp(d.p, ''); return render(); }

    if (act === 'saveAmana') {
      var am = S.amanat.filter(function (x) { return x.id === S.sel; })[0];
      var patch = { name: document.getElementById('an').value.trim(), tagline: document.getElementById('at').value.trim(), kind: document.getElementById('ak').value, visible: document.getElementById('av').checked };
      if (!patch.name) return toast('اسم الأمانة مطلوب', true);
      return sb.from('amanat').update(patch).eq('id', am.id).then(function (r) { if (r.error) return fail(r.error); Object.assign(am, patch); toast('تم حفظ الأمانة'); render(); });
    }
    if (act === 'addBlock') {
      var title = document.getElementById('nt').value.trim(), type = document.getElementById('ny').value;
      if (!title) return toast('اكتب عنوان النافذة', true);
      var row = { amana_id: S.sel, type: type, title: title, description: '', icon: DEFICON[type], content: type === 'text' ? { text: '' } : { items: [] }, sort: S.blocks.length + 1 };
      return sb.from('blocks').insert(row).select().single().then(function (r) { if (r.error) return fail(r.error); toast('أُضيفت النافذة'); return loadBlocks().then(render); });
    }
    if (act === 'saveBlock') {
      var c = b.type === 'text' ? { text: b.content.text } : { items: clean(b.content.items) };
      el.disabled = true;
      return sb.from('blocks').update({ title: (b.title || '').trim() || 'بدون عنوان', description: (b.description || '').trim(), icon: b.icon, content: c, visible: b.visible, updated_at: new Date().toISOString() }).eq('id', b.id)
        .then(function (r) { el.disabled = false; if (r.error) return fail(r.error); b.content = c; toast('تم الحفظ'); render(); });
    }
    if (act === 'delBlock') {
      if (!confirm('حذف نافذة «' + b.title + '» نهائياً؟')) return;
      return sb.from('blocks').delete().eq('id', b.id).then(function (r) { must(r); S.blocks.splice(+d.b, 1); return renumber().then(function () { toast('حُذفت'); render(); }); }).catch(fail);
    }
    if (act === 'up' || act === 'down') {
      var bi = +d.b, j = act === 'up' ? bi - 1 : bi + 1; if (j < 0 || j >= S.blocks.length) return;
      var tmp = S.blocks[bi]; S.blocks[bi] = S.blocks[j]; S.blocks[j] = tmp;
      return renumber().then(render).catch(function (err) { fail(err); loadBlocks().then(render); });
    }

    /* استبيانات */
    var s = S.surveys[+d.s];
    if (act === 'newSurvey') {
      var st = document.getElementById('nst').value.trim(), sk = document.getElementById('nsk').value;
      if (!st) return toast('اكتب موضوع الاستبيان', true);
      return sb.from('surveys').insert({ title: st, topic: '', kind: sk, questions: [], open: false }).then(function (r) { must(r); toast('أُنشئ الاستبيان — أضف أسئلته ثم افتحه للردود'); return loadSurveys().then(render); }).catch(fail);
    }
    if (act === 'saveSurvey') {
      var pl; try { pl = surveyPayload(s); } catch (x) { return fail(x); }
      return sb.from('surveys').update(pl.row).eq('id', s.id).then(function (r) {
        must(r); s.questions = pl.qs.map(function (q) { q.opt = q.options.join('\n'); return q; }); s.title = pl.row.title; toast('تم حفظ الاستبيان'); render();
      }).catch(fail);
    }
    if (act === 'delSurvey') {
      if (!confirm('حذف «' + s.title + '» وكل ردوده نهائياً؟')) return;
      return sb.from('surveys').delete().eq('id', s.id).then(function (r) { must(r); toast('حُذف'); return loadSurveys().then(render); }).catch(fail);
    }
    if (act === 'csvSurvey') {
      var rs = S.resp[s.id] || []; if (!rs.length) return toast('لا توجد ردود للتصدير', true);
      return csv('survey-' + s.id.slice(0, 6), ['التاريخ'].concat(s.questions.map(function (q) { return q.text; })),
        rs.map(function (r) { return [fd(r.created_at)].concat(s.questions.map(function (q) { var v = r.answers && r.answers[q.id]; return [].concat(v == null ? '' : v).join(' | '); })); }));
    }

    /* نوادي */
    var cl = S.clubs[+d.s];
    if (act === 'newClub') {
      var cn = document.getElementById('ncn').value.trim(); if (!cn) return toast('اكتب اسم النادي', true);
      return sb.from('clubs').insert({ name: cn }).then(function (r) { must(r); toast('أُنشئ النادي'); return loadClubs().then(render); }).catch(fail);
    }
    if (act === 'saveClub') {
      if (!(cl.name || '').trim()) return toast('اسم النادي مطلوب', true);
      var news = clean(cl.news);
      return sb.from('clubs').update({ name: cl.name.trim(), description: cl.description.trim(), image_url: cl.image_url, open: !!cl.open, news: news }).eq('id', cl.id)
        .then(function (r) { must(r); cl.news = news; toast('تم حفظ النادي'); render(); }).catch(fail);
    }
    if (act === 'delClub') {
      if (!confirm('حذف نادي «' + cl.name + '» وكل المسجّلين فيه نهائياً؟')) return;
      return sb.from('clubs').delete().eq('id', cl.id).then(function (r) { must(r); toast('حُذف'); return loadClubs().then(render); }).catch(fail);
    }
    if (act === 'csvClub') {
      var ms = S.members[cl.id] || []; if (!ms.length) return toast('لا يوجد مسجّلون للتصدير', true);
      return csv('club-' + cl.id.slice(0, 6), ['الاسم', 'رقم التواصل', 'البريد', 'تاريخ التسجيل'], ms.map(function (m) { return [m.name, m.phone, m.email, fd(m.created_at)]; }));
    }

    if (act === 'saveUser') {
      var u = S.users[+d.u], role = u.role === 'super' ? 'super' : 'amin';
      return sb.from('profiles').update({ role: role, amana_id: role === 'super' ? null : (u.amana_id || null) }).eq('id', u.id)
        .then(function (r) { if (r.error) return fail(r.error); toast('تم تحديث ' + u.email); });
    }
  });

  boot();
})();
</script>
</body>
</html>
